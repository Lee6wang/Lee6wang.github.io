<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<script>
  /* Start new visitors in the lab's dark palette; preserve later theme choices. */
  try {
    if (typeof Theme !== 'undefined' && Theme.isToggleable && !localStorage.getItem('lab-theme-initialized')) {
      if (Theme.isSystemTheme) Theme.update(Theme.Mode.DARK);
      localStorage.setItem('lab-theme-initialized', 'true');
    }
  } catch (error) {
    /* Storage may be unavailable; Chirpy's system theme remains usable. */
  }
  window.siteBaseUrl = {{ site.baseurl | default: '' | jsonify }};
</script>

{% for entry in page.language_versions %}
  <link rel="alternate" hreflang="{{ entry[1].lang }}" href="{{ site.url }}{{ entry[1].url }}">
{% endfor %}
{% if page.language_versions.en %}
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.language_versions.en.url }}">
{% endif %}

<script defer src="{{ '/assets/js/custom.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

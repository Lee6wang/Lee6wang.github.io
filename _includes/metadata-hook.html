<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<script>
  /* Start new visitors in the lab's dark palette; preserve later theme choices. */
  try {
    if (typeof Theme !== 'undefined' && Theme.isToggleable && !localStorage.getItem('lab-theme-initialized')) {
      if (Theme.isSystemTheme) Theme.update(Theme.Mode.DARK);
      localStorage.setItem('lab-theme-initialized', 'true');
    }
  } catch (error) {
    /* Storage may be unavailable; Chirpy's system theme remains usable. */
  }
  window.siteBaseUrl = {{ site.baseurl | default: '' | jsonify }};

  /* Decide before first paint; both languages share this tab's session. */
  (() => {
    const root = document.documentElement;
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    try {
      if (sessionStorage.getItem('lab-entry-seen')) return;
      sessionStorage.setItem('lab-entry-seen', 'true');
    } catch (error) {
      /* Skip the effect when we cannot reliably remember the visit. */
      return;
    }
    if (motion.matches || document.hidden) return;

    const finish = () => {
      root.classList.remove('site-entering');
      clearTimeout(fallback);
      document.removeEventListener('animationend', onEnd);
      window.removeEventListener('pagehide', finish);
      document.removeEventListener('visibilitychange', onVisibility);
      motion.removeEventListener('change', finish);
    };
    const onEnd = (event) => {
      if (event.animationName === 'site-entry-dismiss' && event.target.id === 'site-entry') finish();
    };
    const onVisibility = () => { if (document.hidden) finish(); };
    const fallback = setTimeout(finish, 2200);
    document.addEventListener('animationend', onEnd);
    window.addEventListener('pagehide', finish);
    document.addEventListener('visibilitychange', onVisibility);
    motion.addEventListener('change', finish);
    root.classList.add('site-entering');
  })();
</script>

{% for entry in page.language_versions %}
  <link rel="alternate" hreflang="{{ entry[1].lang }}" href="{{ site.url }}{{ entry[1].url }}">
{% endfor %}
{% if page.language_versions.en %}
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.language_versions.en.url }}">
{% endif %}

<script defer src="{{ '/assets/js/custom.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
